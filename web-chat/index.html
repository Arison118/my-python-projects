<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISON AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nampidirina tsara ny Marked.js mba hanovana ny ### ho Sous-titres sy ny ** ho Loko -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; }
        
        header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .header-title { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; color: #00f2fe; }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .welcome-card { text-align: center; margin: auto; max-width: 320px; }
        .avatar-container { width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%; padding: 4px; background: linear-gradient(45deg, #00f2fe, #4facfe); box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .welcome-card h1 { font-size: 1.8rem; color: #00f2fe; margin-bottom: 10px; }
        .welcome-card p { color: #94a3b8; font-size: 0.9rem; }

        .message { max-width: 90%; padding: 10px 0; font-size: 0.98rem; line-height: 1.6; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: linear-gradient(135deg, #0061ff, #60efb8); color: #fff; padding: 12px 16px; border-radius: 18px; border-bottom-right-radius: 4px; }
        
        /* Valin-tenin'ny AI: TSY MISY CADRE/FOND NTSONY (Transparent completely) */
        .bot-message { 
            align-self: flex-start; 
            background: transparent !important; 
            border: none !important; 
            box-shadow: none !important; 
            color: #e2e8f0; 
            width: 100%;
        }

        /* Loko manokana ho an'ny SOUS-TITRES (###) sy TENY MISONGADINA (**) */
        .bot-message h1, .bot-message h2, .bot-message h3 { 
            color: #00f2fe !important; 
            margin-top: 15px; 
            margin-bottom: 8px; 
            font-size: 1.15rem;
            font-weight: 700;
        }

        .bot-message strong { 
            color: #ff007f !important; /* Loko mavokely (pink/neon) ho an'ny teny lehibe */
            font-weight: bold; 
        }

        .bot-message p {
            margin-bottom: 10px;
        }

        /* Menu n'ilay bouton + sy fichier */
        .input-area { background: #0f172a; padding: 10px 15px; border-top: 1px solid rgba(255, 255, 255, 0.05); position: relative; }
        .file-menu { display: none; position: absolute; bottom: 70px; left: 15px; background: #1e293b; border-radius: 12px; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 5px 20px rgba(0,0,0,0.5); flex-direction: column; gap: 10px; }
        .file-menu button { background: transparent; border: none; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; padding: 8px 12px; cursor: pointer; border-radius: 6px; text-align: left; }
        .file-menu button:hover { background: rgba(255,255,255,0.1); }
        .file-menu i { color: #00f2fe; width: 20px; }

        .input-container { display: flex; gap: 8px; align-items: center; }
        .btn-icon { background: #1e293b; border: none; color: #00f2fe; width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .input-box { flex: 1; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; }
        .send-btn { background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; width: 40px; height: 40px; border-radius: 50%; color: #000; font-size: 1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-title"><i class="fa-solid fa-robot"></i> ARISON ✨</div>
        <i class="fa-solid fa-pen-to-square"></i>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-card" id="welcomeCard">
            <p style="color: #00f2fe; margin-bottom: 15px;">"Tongasoa ianao tompoko eo amin'ny"</p>
            <div class="avatar-container">
                <img src="arison.jpg" alt="Arison Avatar">
            </div>
            <h1>AI ARISON</h1>
            <p>"Mazoto ary tompoko dia mirary fahombiazana hatrany e🤗"</p>
        </div>
    </div>

    <div class="input-area">
        <div class="file-menu" id="fileMenu">
            <button onclick="triggerFile('file')"><i class="fa-solid fa-file"></i> Fichier (PDF, Doc, TXT...)</button>
            <button onclick="triggerFile('image')"><i class="fa-solid fa-image"></i> Galerie / Photo</button>
            <button onclick="triggerFile('camera')"><i class="fa-solid fa-camera"></i> Camera</button>
        </div>

        <div class="input-container">
            <button class="btn-icon" onclick="toggleMenu()"><i class="fa-solid fa-plus"></i></button>
            <input type="text" class="input-box" id="userInput" placeholder="Soraty na teneno fotsiny..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="btn-icon" id="micBtn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(event)">
    <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFileUpload(event)">

    <script src="script.js"></script>
</body>
</html>
