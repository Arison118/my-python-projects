<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ARISON</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <button id="sidebar-toggle" class="icon-btn"><i class="fa-solid fa-bars"></i></button>

            <!-- MODEL SELECTOR DROPDOWN (OFFICIAL GEMINI STYLE) -->
            <div class="model-dropdown-container">
                <button id="model-dropdown-btn" class="model-btn">
                    <span id="current-model-label">3.5 Flash-Lite</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                
                <div id="model-menu" class="model-menu hidden">
                    <div class="model-option active" data-model="lite">
                        <div class="model-title">3.5 Flash-Lite</div>
                        <div class="model-desc">Réponses les plus rapides</div>
                    </div>
                    <div class="model-option" data-model="flash">
                        <div class="model-title">3.6 Flash</div>
                        <div class="model-desc">Aide polyvalente</div>
                    </div>
                    <div class="model-option" data-model="pro">
                        <div class="model-title">3.1 Pro</div>
                        <div class="model-desc">Raisonnement avancé</div>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </header>

        <!-- CHAT CONTAINER -->
        <div id="chat-box" class="chat-box">
            <!-- Messages load here -->
        </div>

        <!-- INPUT CONTAINER -->
        <div class="input-container">
            <form id="chat-form" class="input-form">
                <label for="file-input" class="icon-btn attach-btn">
                    <i class="fa-solid fa-paperclip"></i>
                    <input type="file" id="file-input" style="display:none;">
                </label>
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Soraty eto ny hafatra..." autocomplete="off">
                    <span id="file-indicator" class="file-indicator hidden">
                        <i class="fa-solid fa-file"></i> <span id="file-name"></span>
                        <i id="remove-file" class="fa-solid fa-xmark remove-file-icon"></i>
                    </span>
                </div>
                <button type="submit" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
